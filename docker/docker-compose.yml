services:
  postgres:
    image: postgres:16-alpine
    container_name: careerverse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: careerverse
      POSTGRES_PASSWORD: careerverse_dev
      POSTGRES_DB: careerverse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerverse -d careerverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: careerverse-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/careerverse_dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Practice Lab code engine — runs user-submitted programs (Piston).
  # JavaScript runs in the browser without it; every other language in
  # the Practice Lab compiler needs this service. Runtimes install
  # themselves on first use into the piston_data volume.
  engine:
    image: ghcr.io/engineer-man/piston:latest
    container_name: careerverse-engine
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston
    environment:
      PISTON_REPO_URL: https://github.com/engineer-man/piston

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  piston_data:
